<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M1b Particle study: The Creation</title>
<style>
  :root { --gesso: #EEE9DF; --stone-200: #CFC8BA; --stone-700: #4A4740; --ink: #1F1D1A; --ochre: #C29545; --gold: #C8A24A; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink); color: var(--gesso); font: 14px/1.4 system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
  #spark { position: fixed; width: 160px; height: 160px; margin: -80px 0 0 -80px; border-radius: 50%; pointer-events: none; opacity: 0;
           background: radial-gradient(circle, rgb(255 244 214 / .95) 0, rgb(200 162 74 / .55) 18%, rgb(200 162 74 / 0) 60%); mix-blend-mode: screen; }
  .panel { position: fixed; padding: .6rem .9rem; border-radius: 8px; background: rgb(31 29 26 / .9); border: 1px solid var(--stone-700); }
  h1 { margin: 0; font-size: 1rem; font-weight: 600; }
  #top { top: 1rem; left: 1rem; max-width: 34rem; }
  #top p { margin: .25rem 0 0; color: var(--stone-200); }
  #stats { top: 1rem; right: 1rem; font-variant-numeric: tabular-nums; text-align: right; }
  form { bottom: 1rem; left: 1rem; right: 1rem; display: flex; flex-wrap: wrap; gap: .5rem 1.25rem; align-items: center; }
  fieldset { border: 0; margin: 0; padding: 0; display: flex; gap: .5rem; align-items: center; }
  legend { float: left; margin-right: .4rem; color: var(--stone-200); }
  label { display: inline-flex; gap: .3rem; align-items: center; min-height: 24px; cursor: pointer; }
  input:focus-visible { outline: 2px solid var(--ochre); outline-offset: 2px; }
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div id="spark"></div>
<div id="top" class="panel">
  <h1>M1b particle study</h1>
  <p>Move your cursor toward God's fingertip (left). The closer you get, the more of the painting rolls into place.</p>
</div>
<div id="stats" class="panel" aria-live="off">loading…</div>
<form id="f" class="panel">
  <fieldset><legend>Image</legend>
    <label><input type="radio" name="img" value="god-mantle" checked> God + mantle (soft cuts)</label>
    <label><input type="radio" name="img" value="whole-group"> Whole group</label>
  </fieldset>
  <fieldset><legend>Density</legend>
    <label><input type="radio" name="density" value="2" checked> High</label>
    <label><input type="radio" name="density" value="3"> Medium</label>
    <label><input type="radio" name="density" value="4"> Low</label>
  </fieldset>
  <fieldset><legend>Ground</legend>
    <label><input type="radio" name="bg" value="dark" checked> Dark</label>
    <label><input type="radio" name="bg" value="plaster"> Plaster</label>
  </fieldset>
  <fieldset><legend>View</legend>
    <label><input type="radio" name="view" value="whole" checked> Whole</label>
    <label><input type="radio" name="view" value="hand"> Hand</label>
  </fieldset>
  <label><input type="checkbox" name="rollback" checked> Roll back when the cursor leaves</label>
  <label>Preview <input type="range" name="p" min="0" max="1" step="0.01" value="0"></label>
</form>
<script>
const $ = s => document.querySelector(s);
const canvas = $('#c'), form = $('#f'), stats = $('#stats'), spark = $('#spark');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false });
const GROUNDS = { dark: [0x1F / 255, 0x1D / 255, 0x1A / 255], plaster: [0xEE / 255, 0xE9 / 255, 0xDF / 255] };

const VS = `#version 300 es
in vec2 aHome; in vec4 aColor; in vec2 aSeed;           // seed.x: random 0..1, seed.y: sampling stride (px)
uniform vec4 uView; uniform vec2 uMin, uMax, uTip;
uniform float uP, uT, uPx, uMaxD;
out vec4 vColor; out float vE; out float vA; out float vAng;
float hash(float n) { return fract(sin(n) * 43758.5453); }
void main() {
  float r1 = aSeed.x, r2 = hash(r1 * 91.7 + 1.3), r3 = hash(r1 * 13.1 + 7.7), r4 = hash(r1 * 57.3 + 3.1);
  bool star = r4 < .1;                                                                      // 1 in 10 waits as a dim star anywhere on screen;
  vec2 start = star ? mix(uMin, uMax, vec2(r2, r3))                                          // the rest are hidden and set off from near home
                    : aHome + vec2(cos(r2 * 6.2832), sin(r2 * 6.2832)) * mix(80., 420., r3);
  start += vec2(sin(uT * .3 + r1 * 6.28), cos(uT * .27 + r2 * 6.28)) * 6.;
  float delay = (1. - clamp(distance(aHome, uTip) / uMaxD, 0., 1.)) * .8 + r1 * .05;    // a wave: far parts first, the fingertip last
  float l = clamp((uP - delay) / .15, 0., 1.);
  float e = 1. - pow(1. - l, 3.);
  vec2 d = aHome - start;
  float side = r1 < .5 ? -1. : 1.;
  float ang = (1. - e) * 12. + r2 * 6.2832;                                                 // the roll: an orbit that unwinds on landing
  vec2 pos = mix(start, aHome, e) + vec2(-d.y, d.x) * side * .18 * sin(3.1416 * e) + vec2(cos(ang), sin(ang)) * (1. - e) * 18.;
  gl_Position = vec4(pos * uView.xy + uView.zw, 0., 1.);
  float settled = aSeed.y * uPx + .6;
  gl_PointSize = mix(1.6, settled, e) + sin(3.1416 * e) * max(settled * .6, 1.5);
  vColor = aColor; vE = e; vAng = ang + length(d) * (1. - e) * .05;
  vA = mix(star ? .5 : 0., 1., smoothstep(0., .3, l)) * step(hash(r1 * 7.7 + .9), aColor.a);  // soft edges thin out instead of turning transparent
}`;
const FS = `#version 300 es
precision mediump float;
in vec4 vColor; in float vE; in float vA; in float vAng;
out vec4 o;
void main() {
  vec2 pc = gl_PointCoord * 2. - 1.;
  float r2 = dot(pc, pc), sq = smoothstep(.9, .995, vE);      // sq = 1: landed, a plain square pixel that tiles with its neighbours
  if (sq < .5 && r2 > 1.) discard;
  vec3 n = vec3(pc, sqrt(max(0., 1. - r2)));
  vec3 L = normalize(vec3(cos(vAng), sin(vAng), 1.2));      // light spins with the roll
  float diff = max(dot(n, L), 0.), spec = pow(max(reflect(-L, n).z, 0.), 24.);
  vec3 ball = vColor.rgb * (.45 + .75 * diff) + spec * .35;
  o = vec4(mix(ball, vColor.rgb, sq), vA);
}`;

function program(vs, fs) {
  const p = gl.createProgram();
  for (const [type, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    gl.attachShader(p, s);
  }
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}

let meta, prog, vao, bufs = [], count = 0, pixels = {}, progress = 0, target = 0, manual = false, pointer = null, built = '';
const U = {};

async function loadPixels(name) {
  if (pixels[name]) return pixels[name];
  const bmp = await createImageBitmap(await (await fetch(`../../data/${name}.webp`)).blob(), { premultiplyAlpha: 'none' });
  const c = new OffscreenCanvas(bmp.width, bmp.height), x = c.getContext('2d');
  x.drawImage(bmp, 0, 0);
  return (pixels[name] = x.getImageData(0, 0, bmp.width, bmp.height).data);
}

async function build() {
  const o = Object.fromEntries(new FormData(form)), key = o.img + o.density;
  if (key === built) return;
  built = key;
  const px = await loadPixels(o.img), { w, h, handX } = meta, s = +o.density, hs = Math.max(1, s - 2);
  const home = [], color = [], seed = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const st = x < handX ? hs : s;                       // the hand and forearm get finer sampling: the camera ends there
    if (x % st || y % st) continue;
    const i = (y * w + x) * 4;
    if (px[i + 3] < 8) continue;
    home.push(x + st / 2, y + st / 2); color.push(px[i], px[i + 1], px[i + 2], px[i + 3]); seed.push(Math.random(), st);
  }
  count = home.length / 2;
  gl.bindVertexArray(vao);
  bufs.forEach(b => gl.deleteBuffer(b)); bufs = [];
  for (const [name, data, size, type, norm] of [['aHome', new Float32Array(home), 2, gl.FLOAT, false],
      ['aColor', new Uint8Array(color), 4, gl.UNSIGNED_BYTE, true], ['aSeed', new Float32Array(seed), 2, gl.FLOAT, false]]) {
    const loc = gl.getAttribLocation(prog, name), buf = gl.createBuffer(); bufs.push(buf);
    gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, size, type, norm, 0, 0);
  }
}

function view() {
  const o = Object.fromEntries(new FormData(form)), { w, h, fingertip: [tx, ty] } = meta;
  const [x0, y0, x1, y1] = o.view === 'hand' ? [tx - 40, ty - 170, tx + 680, ty + 200] : [-60, -40, w + 40, h + 40];
  const vw = innerWidth, vh = innerHeight - 70, s = Math.min(vw / (x1 - x0), vh / (y1 - y0));
  return { s, ox: (vw - (x1 - x0) * s) / 2 - x0 * s, oy: (vh - (y1 - y0) * s) / 2 - y0 * s, vw: innerWidth, vh: innerHeight };
}

let last = performance.now(), fps = 60;
function frame(now) {
  const dt = Math.min((now - last) / 1000, .1); last = now; fps += (1 / Math.max(dt, 1e-3) - fps) * .05;
  const o = Object.fromEntries(new FormData(form)), v = view(), dpr = Math.min(devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(v.vw * dpr) || canvas.height !== Math.round(v.vh * dpr)) {
    canvas.width = Math.round(v.vw * dpr); canvas.height = Math.round(v.vh * dpr);
  }
  const tipX = meta.fingertip[0] * v.s + v.ox, tipY = meta.fingertip[1] * v.s + v.oy;
  if (manual) target = +o.p;
  else if (pointer) {
    const d = Math.hypot(pointer[0] - tipX, pointer[1] - tipY), near = 28, far = Math.max(v.vw, v.vh) * .8;
    const t = 1 - Math.min(Math.max((d - near) / (far - near), 0), 1);
    target = t * t * (3 - 2 * t);
  }
  const goal = o.rollback ? target : Math.max(target, progress);
  progress += (goal - progress) * (1 - Math.exp(-dt * 3.5));
  if (!manual) form.p.value = progress.toFixed(2);

  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(...GROUNDS[o.bg], 1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.useProgram(prog); gl.bindVertexArray(vao);
  gl.uniform4f(U.uView, 2 * v.s / v.vw, -2 * v.s / v.vh, 2 * v.ox / v.vw - 1, 1 - 2 * v.oy / v.vh);
  gl.uniform2f(U.uMin, -meta.w * .25, -meta.h * .3); gl.uniform2f(U.uMax, meta.w * 1.25, meta.h * 1.3);
  gl.uniform2f(U.uTip, ...meta.fingertip); gl.uniform1f(U.uMaxD, meta.w);
  gl.uniform1f(U.uP, progress); gl.uniform1f(U.uT, now / 1000); gl.uniform1f(U.uPx, v.s * dpr);
  gl.drawArrays(gl.POINTS, 0, count);

  const sp = progress > .97 && pointer && !manual ? Math.max(0, 1 - Math.hypot(pointer[0] - tipX, pointer[1] - tipY) / 60) : 0;
  spark.style.transform = `translate(${tipX}px, ${tipY}px)`; spark.style.opacity = sp.toFixed(2);
  stats.textContent = `${count.toLocaleString()} particles · ${fps.toFixed(0)} fps · ${(progress * 100).toFixed(0)}% assembled`;
  requestAnimationFrame(frame);
}

async function init() {
  if (!gl) { stats.textContent = 'WebGL2 is not available: the site would show a still image here.'; return; }
  prog = program(VS, FS);
  for (const n of ['uView', 'uMin', 'uMax', 'uTip', 'uP', 'uT', 'uPx', 'uMaxD']) U[n] = gl.getUniformLocation(prog, n);
  vao = gl.createVertexArray();
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  meta = await (await fetch('../../data/particles.json')).json();
  const q = new URLSearchParams(location.search);       // ?img=&density=&bg=&view=&p= for screenshots
  for (const k of ['img', 'density', 'bg', 'view']) if (q.has(k)) form.querySelector(`[name=${k}][value="${q.get(k)}"]`).checked = true;
  if (q.has('p')) { manual = true; form.p.value = q.get('p'); progress = +q.get('p'); }
  await build();
  requestAnimationFrame(frame);
}

canvas.addEventListener('pointermove', e => { pointer = [e.clientX, e.clientY]; manual = false; });
canvas.addEventListener('pointerleave', () => { pointer = null; target = 0; });
form.addEventListener('input', e => { if (e.target.name === 'p') manual = true; else build(); });
init().catch(err => { stats.textContent = 'Error: ' + err.message; console.error(err); });
</script>
</body>
</html>
