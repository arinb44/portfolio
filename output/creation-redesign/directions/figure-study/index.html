<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M1 Figure study: The Creation in nodes</title>
<style>
  :root {
    --gesso: #EEE9DF; --stone-200: #CFC8BA; --stone-700: #4A4740; --ink: #1F1D1A;
    --ultramarine: #24407A; --vermilion: #B03F2C; --ochre: #C29545; --gold: #C8A24A;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 system-ui, sans-serif; background: var(--ink); color: var(--gesso); }
  canvas { display: block; width: 100vw; height: 100vh; }
  form {
    position: fixed; left: 1rem; bottom: 1rem; display: flex; flex-wrap: wrap; gap: .75rem 1.25rem; align-items: center;
    max-width: calc(100vw - 2rem); padding: .75rem 1rem; border-radius: 8px;
    background: rgb(31 29 26 / .88); color: var(--gesso); border: 1px solid var(--stone-700);
  }
  fieldset { border: 0; margin: 0; padding: 0; display: flex; gap: .5rem; align-items: center; }
  legend { float: left; margin-right: .5rem; color: var(--stone-200); }
  label { display: inline-flex; gap: .3rem; align-items: center; min-height: 24px; cursor: pointer; }
  input:focus-visible, select:focus-visible { outline: 2px solid var(--ochre); outline-offset: 2px; }
  h1 { position: fixed; top: 1rem; left: 1rem; margin: 0; font-size: 1rem; font-weight: 600; padding: .4rem .7rem;
       border-radius: 6px; background: rgb(31 29 26 / .88); }
</style>
</head>
<body>
<h1>M1 figure study: is this God from <i>The Creation of Adam</i>?</h1>
<canvas id="c" aria-label="Node drawing of God from Michelangelo's Creation of Adam" role="img"></canvas>
<form id="f">
  <fieldset><legend>Look</legend>
    <label><input type="radio" name="look" value="night" checked> A, Night Sky</label>
    <label><input type="radio" name="look" value="plaster"> B, Fresco Plaster</label>
  </fieldset>
  <fieldset><legend>Show</legend>
    <label><input type="radio" name="parts" value="1"> God only</label>
    <label><input type="radio" name="parts" value="2" checked> + mantle</label>
  </fieldset>
  <fieldset><legend>View</legend>
    <label><input type="radio" name="view" value="whole" checked> Whole</label>
    <label><input type="radio" name="view" value="hand"> Hand</label>
    <label><input type="radio" name="view" value="head"> Head</label>
  </fieldset>
  <label><input type="checkbox" name="lines" checked> Lines</label>
  <label>Tone density <input type="range" name="density" min="0" max="2" step="0.1" value="1"></label>
</form>
<script>
const LOOKS = {
  night: {
    bg(ctx, w, h) {
      ctx.fillStyle = '#1F1D1A'; ctx.fillRect(0, 0, w, h);
      const g = ctx.createRadialGradient(w * .62, h * .45, 0, w * .62, h * .45, Math.max(w, h) * .7);
      g.addColorStop(0, 'rgb(36 64 122 / .55)'); g.addColorStop(1, 'rgb(36 64 122 / 0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    },
    blend: 'lighter',
    line: 'rgb(200 162 74 / .45)', strokeLine: 'rgb(200 162 74 / .8)',
    dot: ['#EEE9DF', '#C29545', '#CFC8BA'], strokeDot: '#EEE9DF',
    show: t => (t / 255) ** 1.6 * 1.2, glow: true,
  },
  plaster: {
    bg(ctx, w, h) {
      ctx.fillStyle = '#EEE9DF'; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = 'rgb(207 200 186 / .35)';
      for (let i = 0; i < w * h / 900; i++) ctx.fillRect(Math.random() * w, Math.random() * h, 1.5, 1.5); // plaster grain
    },
    blend: 'source-over',
    line: 'rgb(74 71 64 / .35)', strokeLine: 'rgb(31 29 26 / .6)',
    dot: ['#1F1D1A', '#B03F2C', '#4A4740'], strokeDot: '#1F1D1A',
    show: t => (1 - t / 255) ** 1.4 * 1.3, glow: false,
  },
};
const VIEWS = { whole: [700, 0, 1920, 800], hand: [705, 320, 1010, 470], head: [1020, 85, 1300, 320] };

const canvas = document.getElementById('c'), ctx = canvas.getContext('2d'), form = document.getElementById('f');
let data;
// Stable per-point random so the tone layer doesn't flicker between redraws.
const rand = i => { let x = Math.imul(i ^ 0x9E3779B9, 0x85EBCA6B); x ^= x >>> 13; x = Math.imul(x, 0xC2B2AE35); return ((x ^ (x >>> 16)) >>> 0) / 4294967296; };

function draw() {
  const o = Object.fromEntries(new FormData(form)), look = LOOKS[o.look], maxPart = +o.parts - 1;
  const dpr = devicePixelRatio || 1, w = innerWidth, h = innerHeight;
  canvas.width = w * dpr; canvas.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  look.bg(ctx, w, h);
  const [x0, y0, x1, y1] = VIEWS[o.view], s = Math.min(w / (x1 - x0), (h - 90) / (y1 - y0)) * .94;
  const ox = (w - (x1 - x0) * s) / 2 - x0 * s, oy = (h - 90 - (y1 - y0) * s) / 2 - y0 * s;
  const X = x => ox + x * s, Y = y => oy + y * s, r = Math.max(.7, Math.sqrt(s) * .9), p = data.pts, d = +o.density;
  const visible = i => p[i * 5 + 2] <= maxPart && (p[i * 5 + 3] !== 1 || rand(i) < look.show(p[i * 5 + 4]) * d);

  ctx.globalCompositeOperation = look.blend;
  if (o.lines) {
    ctx.lineWidth = Math.max(.5, s * .35);
    for (let k = 0; k < data.links.length; k += 2) {
      const a = data.links[k], b = data.links[k + 1];
      if (!visible(a) || !visible(b)) continue;
      ctx.strokeStyle = p[a * 5 + 3] === 2 ? look.strokeLine : look.line;
      ctx.beginPath(); ctx.moveTo(X(p[a * 5]), Y(p[a * 5 + 1])); ctx.lineTo(X(p[b * 5]), Y(p[b * 5 + 1])); ctx.stroke();
    }
  }
  for (let i = 0; i < p.length / 5; i++) {
    if (!visible(i)) continue;
    const kind = p[i * 5 + 3], x = X(p[i * 5]), y = Y(p[i * 5 + 1]);
    const rr = r * (kind === 2 ? 1.25 : kind === 0 ? 1 : .7);
    if (look.glow && kind !== 1) {
      ctx.fillStyle = 'rgb(200 162 74 / .12)';
      ctx.beginPath(); ctx.arc(x, y, rr * 3.2, 0, 7); ctx.fill();
    }
    ctx.fillStyle = kind === 2 ? look.strokeDot : look.dot[p[i * 5 + 2]];
    ctx.beginPath(); ctx.arc(x, y, rr, 0, 7); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

fetch('../../data/god-nodes.json').then(r => r.json()).then(j => { data = j; draw(); });
form.addEventListener('input', draw);
addEventListener('resize', () => data && draw());
</script>
</body>
</html>
