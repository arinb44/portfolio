<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M4 batch 3 round 1 · Nightfall loop</title>
<!-- Fonts and Night Sky tokens: the copy made for the fresco intro (absolute font URLs). -->
<link rel="stylesheet" href="/output/fresco-intro/directions/shared/home/tokens.css">
<style>
  /* Header, card, gradients and stop: copied from src/styles/creation.css. */
  html { background: var(--bg); color: var(--text); font-family: var(--font-body); }
  body { margin: 0; }
  .site { position: fixed; inset: 0 0 auto; z-index: 2; display: flex; justify-content: space-between; align-items: baseline; gap: 2rem;
          padding: 1.75rem 2.5rem 3rem; pointer-events: none;
          background: linear-gradient(to bottom, color-mix(in srgb, var(--bg) 88%, transparent), transparent); }
  .site > * { pointer-events: auto; }
  .site h1 { margin: 0; font: 400 2rem/1.15 var(--font-display); }
  .site .tagline { margin: .25rem 0 0; color: var(--muted); font-size: .9375rem; max-width: 28rem; }
  .site nav ul { display: flex; gap: 1.75rem; margin: 0; padding: 0; list-style: none; font: .875rem/1.5 var(--font-label); }
  .site nav a { text-decoration: none; color: var(--muted); }
  .visuals { position: fixed; inset: 0; }
  .visuals video, .visuals img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .visuals .plaster { mix-blend-mode: multiply; }                       /* the fresco's grain and cracks, held still (#21) */
  .visuals .poster { display: none; }
  html.still .visuals .poster { display: block; }
  html.still .visuals video, html.still .visuals .plaster { display: none; }   /* the poster has the grain baked in */
  .visuals::after { content: ''; position: absolute; inset: 0;
    background: linear-gradient(to right, color-mix(in srgb, var(--bg) 94%, transparent) 0 32%, color-mix(in srgb, var(--bg) 55%, transparent) 46%, transparent 64%),
                linear-gradient(to bottom, color-mix(in srgb, var(--bg) 80%, transparent), transparent 9rem); }
  main { position: relative; z-index: 1; }
  .stop { min-height: 100vh; display: flex; align-items: center; padding: 6rem 0 4rem 5vw; box-sizing: border-box; }
  .card { width: min(30vw, 30rem); }
  .card .count { margin: 0 0 .75rem; font: .8125rem/1.5 var(--font-label); letter-spacing: .06em; color: var(--accent); }
  .card h3 { margin: 0 0 .75rem; font: 400 clamp(2.5rem, 4vw, 3.75rem)/1.05 var(--font-display); text-wrap: balance; }
  .card .line { margin: 0 0 1rem; font-size: 1.125rem; line-height: 1.55; text-wrap: pretty; }
  .card .meta { margin: 0 0 1.5rem; color: var(--muted); font: .875rem/1.6 var(--font-label); }
  .card .links { display: flex; flex-wrap: wrap; gap: .75rem 1.5rem; align-items: center; margin: 0; }
  .card .links a { font: .9375rem/1.5 var(--font-label); text-underline-offset: .25em; min-height: 24px; display: inline-flex; align-items: center; color: var(--text); }
  .card .links a.primary { padding: .6rem 1.1rem; border-radius: 999px; text-decoration: none; background: var(--text); color: var(--bg); }
  .card .next { margin: 2.5rem 0 0; color: var(--muted); font: .8125rem/1.5 var(--font-label); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }

  /* Pause control (#22, WCAG 2.2.2): an ink pill bottom-right, readable over any frame. The label says the action. */
  .pause { position: fixed; z-index: 2; right: 2.5rem; bottom: 2rem; min-height: 2.25rem; padding: 0 1rem; display: inline-flex; align-items: center; gap: .55rem;
           font: .8125rem/1 var(--font-label); letter-spacing: .04em; cursor: pointer;
           color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 999px; }
  .pause:hover { border-color: var(--muted); }
  .pause svg { width: .75rem; height: .75rem; fill: currentColor; flex: none; }
  .pause .play, .pause.paused .bars { display: none; } .pause.paused .play { display: block; }
  html.still .pause { display: none; }                                    /* nothing moves, nothing to pause */

  /* Review bar: not part of the design. */
  .bar { position: fixed; z-index: 3; left: 50%; translate: -50% 0; top: .6rem; display: flex; gap: .4rem; align-items: center; padding: .4rem .6rem;
         background: #000d; border: 1px solid var(--line); border-radius: .5rem; font: .75rem/1.3 var(--font-label); }
  .bar button { font: inherit; color: var(--text); background: none; border: 1px solid var(--line); border-radius: .25rem; padding: .25rem .5rem; cursor: pointer; }
  .bar button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  html.noreview .bar { display: none; }
</style>
</head>
<body>
<header class="site">
  <div><h1>[Your Name]</h1><p class="tagline">[One line: what you build, e.g. models, games, generative art]</p></div>
  <nav aria-label="Site"><ul><li><a href="#">Projects</a></li><li><a href="#">About</a></li><li><a href="#">CV</a></li><li><a href="#">Email</a></li></ul></nav>
</header>
<!-- The Nightfall visual: decoration, the card carries the text. -->
<div class="visuals" aria-hidden="true">
  <video muted loop autoplay playsinline poster="poster-150.webp">
    <source src="nightfall-nograin.webm" type="video/webm">
    <source src="nightfall-nograin.mp4" type="video/mp4">
  </video>
  <img class="plaster" src="plaster.webp" alt="">
  <img class="poster" src="poster-150.webp" alt="">
</div>
<button class="pause" type="button"><svg class="bars" viewBox="0 0 12 12" aria-hidden="true"><rect x="1.5" y="1" width="3" height="10"/><rect x="7.5" y="1" width="3" height="10"/></svg><svg class="play" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1l9 5-9 5z"/></svg><span>Pause</span><span class="visually-hidden"> the background video</span></button>
<main>
  <h2 class="visually-hidden">Projects</h2>
  <section class="stop" id="nightfall" aria-labelledby="t-nightfall">
    <article class="card">
      <p class="count">07 / 07</p>
      <h3 id="t-nightfall">Nightfall</h3>
      <p class="line">A 3D Godot game built around a flashlight, a campfire and a creature.</p>
      <p class="meta">2024 · Godot, GDScript</p>
      <p class="links">
        <a class="primary" href="#">View project<span class="visually-hidden">: Nightfall</span></a>
        <a href="#">Live demo<span aria-hidden="true"> ↗</span></a>
        <a href="#">Code<span aria-hidden="true"> ↗</span></a>
      </p>
    </article>
  </section>
</main>
<div class="bar" role="group" aria-label="Review options">
  <button type="button" id="still" aria-pressed="false">reduced motion</button>
  <button type="button" id="seam">loop seam</button>
</div>
<script>
  const html = document.documentElement, v = document.querySelector('video'), btn = document.querySelector('.pause');
  btn.onclick = () => v.paused ? v.play() : v.pause();
  const sync = () => { btn.classList.toggle('paused', v.paused); btn.querySelector('span').textContent = v.paused ? 'Play' : 'Pause'; };
  v.addEventListener('play', sync); v.addEventListener('pause', sync);   // the label follows the video, whatever paused it
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { html.classList.add('still'); v.removeAttribute('autoplay'); v.pause(); }
  // Review bar. ?still&noreview for screenshots.
  const st = document.getElementById('still');
  st.onclick = () => { const s = html.classList.toggle('still'); st.setAttribute('aria-pressed', s); s ? v.pause() : v.play(); };
  document.getElementById('seam').onclick = () => { v.currentTime = Math.max(0, v.duration - 1.5); v.play(); };
  const q = new URLSearchParams(location.search);
  if (q.has('still')) st.click();
  if (q.has('noreview')) html.classList.add('noreview');
</script>
</body>
</html>
