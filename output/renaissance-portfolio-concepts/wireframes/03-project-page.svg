<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1620" width="1440" height="1620" role="img" aria-labelledby="t d">
  <title id="t">Wireframe 03: Project page with Beneath the Paint layers (desktop)</title>
  <desc id="d">Project page: the first screen is the finished result with title, metric, role, stack and demo and code links. Edge wings link to previous and next projects. A lens and a layer slider reveal the process layers; below, the same layers are laid out as normal scrolling content.</desc>
  <style>
    .bg{fill:#f4f1ea}.wing{fill:#cfc8ba;stroke:#666;stroke-width:1.5}.art{fill:#bdb6a8;stroke:#666;stroke-width:1.5}
    .under{fill:#e4dfd4;stroke:#4a4740;stroke-width:1.2;stroke-dasharray:3 4}.sec{fill:none;stroke:#8f897f;stroke-width:1.5}
    .t{font-family:Georgia,'EB Garamond',serif;fill:#1f1d1a}.ui{font-family:Arial,Helvetica,sans-serif;fill:#1f1d1a;font-size:15px}
    .s{font-family:Arial,Helvetica,sans-serif;fill:#4a4740;font-size:12px}.m{font-family:'Courier New',monospace;fill:#4a4740;font-size:12px}
    .btn{fill:#24407a}.bt{font-family:Arial,Helvetica,sans-serif;fill:#eee9df;font-size:14px}.chip{fill:#e4dfd4;stroke:#8f897f}
    .n{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#b03f2c}.c{fill:#b03f2c}
    .cn{font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:bold;fill:#fff;text-anchor:middle}
    .lens{fill:none;stroke:#1f1d1a;stroke-width:3}.fold{stroke:#b03f2c;stroke-width:1.5;stroke-dasharray:8 6}
  </style>
  <rect class="bg" width="1440" height="1620"/>
  <text class="ui" x="40" y="44">[monogram]  ← Altarpiece</text>
  <text class="ui" x="1300" y="44">Index</text>
  <!-- edge wings -->
  <rect class="wing" x="0" y="80" width="56" height="680"/>
  <text class="s" x="34" y="420" transform="rotate(-90 34 420)" text-anchor="middle">◂  NFL Predictor</text>
  <rect class="wing" x="1384" y="80" width="56" height="680"/>
  <text class="s" x="1406" y="420" transform="rotate(90 1406 420)" text-anchor="middle">MLB Predictor  ▸</text>
  <!-- hero = varnish layer -->
  <rect class="art" x="96" y="90" width="760" height="470"/>
  <text class="s" x="116" y="540">[Layer 1 · Varnish: finished product, painterly-treated screenshot or muted demo loop]</text>
  <circle class="lens" cx="640" cy="250" r="90"/>
  <rect class="under" x="560" y="170" width="160" height="160" rx="80"/>
  <text class="s" x="640" y="255" text-anchor="middle">[underdrawing</text><text class="s" x="640" y="271" text-anchor="middle">shows here]</text>
  <text class="t" x="900" y="130" font-size="34">NBA Game Predictor</text>
  <text class="s" x="900" y="160">[one line from README: winner, margin, calibrated probability]</text>
  <text class="t" x="900" y="215" font-size="26">67.5% winner accuracy</text>
  <text class="s" x="900" y="238">vs 55.2% home-team baseline · 2025-26 season, 1,225 unseen games</text>
  <text class="s" x="900" y="280">ROLE  Solo · design, data, model, deploy</text>
  <rect class="chip" x="900" y="296" width="62" height="24" rx="12"/><text class="s" x="931" y="312" text-anchor="middle">Python</text>
  <rect class="chip" x="968" y="296" width="96" height="24" rx="12"/><text class="s" x="1016" y="312" text-anchor="middle">scikit-learn</text>
  <rect class="chip" x="1070" y="296" width="66" height="24" rx="12"/><text class="s" x="1103" y="312" text-anchor="middle">Docker</text>
  <rect class="chip" x="1142" y="296" width="84" height="24" rx="12"/><text class="s" x="1184" y="312" text-anchor="middle">Streamlit</text>
  <rect class="btn" x="900" y="345" width="150" height="42" rx="4"/><text class="bt" x="975" y="371" text-anchor="middle">Live demo ↗</text>
  <rect class="btn" x="1062" y="345" width="110" height="42" rx="4"/><text class="bt" x="1117" y="371" text-anchor="middle">Code ↗</text>
  <text class="s" x="900" y="410">[cold-start note appears here when needed, e.g. "wakes in ~30–60 s"</text>
  <text class="s" x="900" y="426"> + a recorded preview video instead of a blank wait]</text>
  <!-- layer slider -->
  <rect x="900" y="470" width="400" height="80" fill="#fff" stroke="#1f1d1a" stroke-width="1.5" rx="6"/>
  <text class="m" x="916" y="494">LAYER 1 OF 4 · VARNISH (finished)</text>
  <line x1="916" y1="522" x2="1250" y2="522" stroke="#8f897f" stroke-width="4"/>
  <circle cx="916" cy="522" r="9" fill="#24407a"/>
  <text class="s" x="1262" y="527">◂ ▸</text>
  <line class="fold" x1="56" y1="600" x2="1384" y2="600"/>
  <text class="n" x="1240" y="592">fold (≈ 900 px viewport)</text>
  <!-- layers as scrolling content -->
  <rect class="sec" x="96" y="640" width="1248" height="250"/>
  <text class="m" x="116" y="670">LAYER 2 · PAINT: key features and results</text>
  <rect class="art" x="116" y="690" width="370" height="180"/><rect class="art" x="502" y="690" width="370" height="180"/>
  <text class="s" x="896" y="720">[caption + tag: finished]</text>
  <text class="s" x="896" y="740">[e.g. calibration chart, team/player explorer]</text>
  <rect class="sec" x="96" y="910" width="1248" height="250"/>
  <text class="m" x="116" y="940">LAYER 3 · UNDERPAINTING: architecture</text>
  <rect class="art" x="116" y="960" width="756" height="180"/>
  <text class="s" x="896" y="990">[diagram: fetch → point-in-time features → walk-forward</text>
  <text class="s" x="896" y="1006"> training → calibration → app] + caption</text>
  <rect class="sec" x="96" y="1180" width="1248" height="200"/>
  <text class="m" x="116" y="1210">LAYER 4 · UNDERDRAWING: origins</text>
  <rect class="under" x="116" y="1230" width="240" height="130"/><rect class="under" x="372" y="1230" width="240" height="130"/>
  <text class="s" x="636" y="1260">[first sketch, early notebook, first commit · tag: in progress]</text>
  <!-- next project -->
  <rect class="wing" x="96" y="1400" width="1248" height="70"/>
  <text class="t" x="720" y="1443" font-size="22" text-anchor="middle">◂ NFL Predictor   ·   Next: MLB Predictor  ▸   (wing folds, 2 × 200 ms)</text>
  <!-- callouts -->
  <circle class="c" cx="76" cy="90" r="12"/><text class="cn" x="76" y="95">1</text>
  <circle class="c" cx="880" cy="215" r="12"/><text class="cn" x="880" y="220">2</text>
  <circle class="c" cx="745" cy="250" r="12"/><text class="cn" x="745" y="255">3</text>
  <circle class="c" cx="1320" cy="510" r="12"/><text class="cn" x="1320" y="515">4</text>
  <circle class="c" cx="1364" cy="760" r="12"/><text class="cn" x="1364" y="765">5</text>
  <text class="n" x="96" y="1505">1  Edge wings are links to prev/next (≥ 44 px wide); scroll-padding keeps them from covering focus (WCAG 2.4.11).</text>
  <text class="n" x="96" y="1527">2  Result first: title, metric, role, stack, demo and code links all above the fold.</text>
  <text class="n" x="96" y="1549">3  Lens: the pointer reveals the underdrawing (120 ms follow; instant under reduced motion).</text>
  <text class="n" x="96" y="1571">4  Layer slider (role=slider, aria-valuetext "Layer 2 of 4: Paint") = keyboard/touch alternative; tap the track to jump (WCAG 2.5.7).</text>
  <text class="n" x="96" y="1593">5  Every layer is also normal content further down: nothing is lens-only.</text>
</svg>
