<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img" aria-labelledby="t d">
  <title id="t">Wireframe 02: Home, open altarpiece (desktop)</title>
  <desc id="d">Open triptych: About on the left wing, featured project in the main panel, Contact on the right wing, and a predella row of seven project links below. All visible above the fold.</desc>
  <style>
    .bg{fill:#f4f1ea}.frame{fill:none;stroke:#8f897f;stroke-width:8}.panel{fill:#dcd6ca;stroke:#666;stroke-width:1.5}
    .art{fill:#bdb6a8}.pre{fill:#cfc8ba;stroke:#666;stroke-width:1.5}.feat{fill:#cfc8ba;stroke:#222;stroke-width:3}
    .t{font-family:Georgia,'EB Garamond',serif;fill:#1f1d1a}.ui{font-family:Arial,Helvetica,sans-serif;fill:#1f1d1a;font-size:15px}
    .s{font-family:Arial,Helvetica,sans-serif;fill:#4a4740;font-size:12px}.btn{fill:#24407a}.bt{font-family:Arial,Helvetica,sans-serif;fill:#eee9df;font-size:14px}
    .n{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#b03f2c}.c{fill:#b03f2c}
    .cn{font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:bold;fill:#fff;text-anchor:middle}
    .br{fill:none;stroke:#4a4740;stroke-width:1.5}
  </style>
  <rect class="bg" width="1440" height="900"/>
  <text class="ui" x="40" y="44">[monogram]</text>
  <text class="ui" x="1160" y="44">Index</text><text class="ui" x="1230" y="44">About</text><text class="ui" x="1305" y="44">GitHub ↗</text>
  <!-- triptych -->
  <rect class="frame" x="250" y="80" width="940" height="520"/>
  <rect class="panel" x="258" y="88" width="230" height="504"/>
  <rect class="panel" x="492" y="88" width="456" height="504"/>
  <rect class="panel" x="952" y="88" width="230" height="504"/>
  <!-- left wing: about -->
  <rect class="art" x="283" y="115" width="180" height="200"/>
  <text class="s" x="373" y="220" text-anchor="middle">[portrait or workshop</text>
  <text class="s" x="373" y="236" text-anchor="middle">scene, painted]</text>
  <text class="t" x="283" y="350" font-size="20">About</text>
  <text class="s" x="283" y="374">[2–3 lines: who you are,</text>
  <text class="s" x="283" y="390">what you build, where]</text>
  <text class="s" x="283" y="430" text-decoration="underline">Read more →</text>
  <!-- main panel: featured -->
  <rect class="art" x="517" y="115" width="406" height="300"/>
  <text class="s" x="720" y="262" text-anchor="middle">[featured project, painterly-treated]</text>
  <text class="t" x="517" y="452" font-size="28">Falling Constellations</text>
  <text class="s" x="517" y="478">[one line] · WebGL2 · Canvas 2D · art</text>
  <rect class="btn" x="517" y="500" width="150" height="40" rx="4"/><text class="bt" x="592" y="525" text-anchor="middle">Open project</text>
  <text class="s" x="690" y="525" text-decoration="underline">Live site ↗</text>
  <text class="s" x="790" y="525" text-decoration="underline">Code ↗</text>
  <!-- right wing: contact -->
  <text class="t" x="977" y="140" font-size="20">Contact</text>
  <text class="s" x="977" y="170" text-decoration="underline">Email</text>
  <text class="s" x="977" y="194" text-decoration="underline">GitHub ↗</text>
  <text class="s" x="977" y="218" text-decoration="underline">CV (PDF)</text>
  <rect class="art" x="977" y="260" width="180" height="200"/>
  <text class="s" x="1067" y="365" text-anchor="middle">[Joseph's workshop</text>
  <text class="s" x="1067" y="381" text-anchor="middle">detail, Merode, CC0]</text>
  <!-- predella -->
  <rect class="frame" x="250" y="610" width="940" height="200"/>
  <g>
    <rect class="pre" x="262" y="622" width="120" height="120"/><text class="s" x="322" y="762" text-anchor="middle">NFL Predictor</text>
    <rect class="pre" x="392" y="622" width="120" height="120"/><text class="s" x="452" y="762" text-anchor="middle">NBA Predictor</text>
    <rect class="pre" x="522" y="622" width="120" height="120"/><text class="s" x="582" y="762" text-anchor="middle">MLB Predictor</text>
    <path class="br" d="M262 780 v10 h380 v-10"/><text class="s" x="452" y="804" text-anchor="middle" font-style="italic">Prediction series</text>
    <rect class="pre" x="660" y="622" width="120" height="120"/><text class="s" x="720" y="762" text-anchor="middle">Hearth</text>
    <rect class="pre" x="790" y="622" width="120" height="120"/><text class="s" x="850" y="762" text-anchor="middle">Juno</text>
    <rect class="pre" x="920" y="622" width="120" height="120"/><text class="s" x="980" y="762" text-anchor="middle">Nightfall</text>
    <rect class="feat" x="1050" y="622" width="120" height="120"/><text class="s" x="1110" y="762" text-anchor="middle">Falling Const. ★</text>
  </g>
  <!-- callouts -->
  <circle class="c" cx="230" cy="680" r="12"/><text class="cn" x="230" y="685">1</text>
  <text class="n" x="20" y="630">1  Predella = &lt;nav&gt; list</text>
  <text class="n" x="38" y="648">of links (decision #18).</text>
  <text class="n" x="38" y="666">One click opens the</text>
  <text class="n" x="38" y="684">project: the scene morphs</text>
  <text class="n" x="38" y="702">into its page header</text>
  <text class="n" x="38" y="720">(350 ms view transition).</text>
  <circle class="c" cx="1210" cy="680" r="12"/><text class="cn" x="1210" y="685">2</text>
  <text class="n" x="1228" y="640">2  Hover/focus: scene lifts</text>
  <text class="n" x="1246" y="658">4 px + gold glint, 100 ms.</text>
  <text class="n" x="1246" y="676">Main panel cross-fades a</text>
  <text class="n" x="1246" y="694">light preview (optional,</text>
  <text class="n" x="1246" y="712">off under reduced motion).</text>
  <circle class="c" cx="230" cy="110" r="12"/><text class="cn" x="230" y="115">3</text>
  <text class="n" x="20" y="150">3  Everything a reviewer</text>
  <text class="n" x="38" y="168">needs is above the fold:</text>
  <text class="n" x="38" y="186">name, all 7 titles, links.</text>
  <circle class="c" cx="1210" cy="300" r="12"/><text class="cn" x="1210" y="305">4</text>
  <text class="n" x="1228" y="300">4  Featured project is a</text>
  <text class="n" x="1246" y="318">placeholder choice; it is</text>
  <text class="n" x="1246" y="336">also in the predella (★)</text>
  <text class="n" x="1246" y="354">so the list is complete.</text>
  <circle class="c" cx="230" cy="790" r="12"/><text class="cn" x="230" y="795">5</text>
  <text class="n" x="20" y="840">5  Sports models grouped as a "Prediction series" (optional suggestion).</text>
  <text class="n" x="20" y="860">Gold frames are decorative only; all text is ink on gesso (13.9:1).</text>
</svg>
